<!-- Widget HTML de Elementor — el mapa del curso.
     Va en dos lugares:
       1. En la portada del curso, sin parámetro: los seis capítulos a color.
       2. Arriba de cada capítulo, con ?cap=N: del 1 al N a color, el resto
          en blanco y negro.
     Cambiá el número del src en cada lección. Nada más. -->
<iframe
  id="gd-mapa"
  src="https://soyloregonzalez.com.ar/experienciaconproposito/wp-content/uploads/academia/mapa.html"
  title="Experiencia con Propósito — El recorrido"
  style="width:100%;height:760px;border:0;display:block"
  loading="lazy"></iframe>

<script>
(function () {
  var ID = "mapa";
  // El alto lo informa el propio mapa: sin scroll interno ni hueco en blanco.
  window.addEventListener("message", function (e) {
    if (!e.data || e.data.gdId !== ID || !e.data.gdHeight) return;
    var f = document.getElementById("gd-" + ID);
    if (f) f.style.height = e.data.gdHeight + "px";
  });
  window.addEventListener("load", function () {
    var f = document.getElementById("gd-" + ID);
    if (f && f.contentWindow) f.contentWindow.postMessage({ gdAsk: ID }, "*");
  });
})();
</script>

<!--
  ============================================================
  LOS SRC DE CADA LECCIÓN
  ============================================================
  Portada del curso   .../academia/mapa.html
  Capítulo 1          .../academia/mapa.html?cap=1
  Capítulo 2          .../academia/mapa.html?cap=2
  Capítulo 3          .../academia/mapa.html?cap=3
  Capítulo 4          .../academia/mapa.html?cap=4
  Capítulo 5          .../academia/mapa.html?cap=5
  Capítulo 6          .../academia/mapa.html?cap=6

  ============================================================
  LAS SIETE LÁMINAS DEL CANVA
  ============================================================
  El mapa dibujado es el arte de Julieth, no una maqueta: la página busca
  una imagen por estado, al lado de mapa.html, con estos nombres exactos.

    página 1 del Canva (todo a color)  ->  mapa-inicio.png
    página 2 (solo el 01 a color)      ->  mapa-1.png
    página 3 (01 y 02)                 ->  mapa-2.png
    página 4 (01 a 03)                 ->  mapa-3.png
    página 5 (01 a 04)                 ->  mapa-4.png
    página 6 (01 a 05)                 ->  mapa-5.png
    página 7 (los seis a color)        ->  mapa-6.png

  Ojo con el corrimiento: la página 1 NO es mapa-1.png, es mapa-inicio.png.

  Para exportarlas: Canva > Compartir > Descargar > PNG, marcar "Tamaño"
  en 2x y bajar las 7 páginas. Vienen numeradas 1 a 7: renombralas según
  la tabla de arriba y subilas a /wp-content/uploads/academia/.
  Sirve .jpg también, con el mismo nombre.

  Mientras no estén subidas la página no se rompe: muestra las seis fichas
  en grilla, con la misma lógica de encendido. Eso es lo mismo que se ve
  siempre en celular, donde una lámina apaisada quedaría ilegible.
-->
