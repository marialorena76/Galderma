<!-- Widget HTML de Elementor — el mapa del curso.
     Va en dos lugares:
       1. En la portada del curso, sin parámetro: los seis capítulos a color.
       2. Arriba de cada capítulo, con ?cap=N: del 1 al N a color, el resto
          en blanco y negro y el N marcado con "Estás acá".
     Cambiá el número del src en cada lección. Nada más. -->
<iframe
  id="gd-mapa"
  src="https://soyloregonzalez.com.ar/experienciaconproposito/wp-content/uploads/academia/mapa.html"
  title="Experiencia con Propósito — El recorrido"
  style="width:100%;height:1100px;border:0;display:block"
  loading="lazy"></iframe>

<script>
(function () {
  var ID = "mapa";
  // El alto lo informa el propio mapa: sin scroll interno ni hueco en blanco.
  window.addEventListener("message", function (e) {
    if (!e.data || e.data.gdId !== ID || !e.data.gdHeight) return;
    var f = document.getElementById("gd-" + ID);
    if (f) f.style.height = e.data.gdHeight + "px";
  });
  window.addEventListener("load", function () {
    var f = document.getElementById("gd-" + ID);
    if (f && f.contentWindow) f.contentWindow.postMessage({ gdAsk: ID }, "*");
  });
})();
</script>

<!--
  Los src de cada lección:

  Portada del curso   .../academia/mapa.html
  Capítulo 1          .../academia/mapa.html?cap=1
  Capítulo 2          .../academia/mapa.html?cap=2
  Capítulo 3          .../academia/mapa.html?cap=3
  Capítulo 4          .../academia/mapa.html?cap=4
  Capítulo 5          .../academia/mapa.html?cap=5
  Capítulo 6          .../academia/mapa.html?cap=6
-->
